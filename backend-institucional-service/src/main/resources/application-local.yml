spring:
  config:
    import: "vault://" # Ativa a integração
  cloud:
    vault:
      uri: http://127.0.0.1:8200
      authentication: APPROLE
      app-role:
        role-id: 69cf7ff1-2857-59bb-deee-cb397e21dd88
        secret-id: da71c89a-f967-898b-aeac-339572894594
      kv:
        enabled: true
        backend: secret
        default-context: backend-institucional-service

  datasource:
    url: jdbc:mysql://localhost:3306/olhar-pedagogico-db
    username: mateus
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8000
